name: validate-macos
on: [push]
jobs:
  macos-arm64-and-cross:
    runs-on: macos-14
    steps:
      - name: real arm64 build + x86_64 cross
        run: |
          set -eux
          export PATH="$HOME/.cargo/bin:/opt/homebrew/bin:$PATH"
          rustc --version; cargo --version
          rustup target list --installed | grep -E 'aarch64-apple-darwin|x86_64-apple-darwin'
          P=$(mktemp -d); cd "$P"; mkdir src
          printf '[package]\nname="vmac"\nversion="0.0.0"\nedition="2021"\n[dependencies]\nserde={version="1",features=["derive"]}\nserde_json="1"\n' > Cargo.toml
          printf 'use serde::Serialize;\n#[derive(Serialize)]\nstruct S{arch:&%sstatic str}\nfn main(){println!("{}",serde_json::to_string(&S{arch:std::env::consts::ARCH}).unwrap());}\n' "'" > src/main.rs
          cargo build --release --target aarch64-apple-darwin
          ./target/aarch64-apple-darwin/release/vmac
          cargo build --release --target x86_64-apple-darwin
          file target/x86_64-apple-darwin/release/vmac
  macos-private-dep-ssh:
    runs-on: macos-14
    steps:
      - name: fetch private repo via host ssh insteadOf
        run: |
          set -eux
          export GIT_SSH_COMMAND="ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 https://github.com/argyle-labs/orca /tmp/orca_priv_mac
          echo "MAC PRIVATE CLONE OK"; ls /tmp/orca_priv_mac | head
