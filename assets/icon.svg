<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="tile"><rect x="16" y="16" width="480" height="480" rx="108"/></clipPath>
    <pattern id="argyle" width="120" height="160" patternUnits="userSpaceOnUse">
      <rect width="120" height="160" fill="#07140F"/>
      <polygon points="60,0 120,80 60,160 0,80" fill="#1C4D3C"/>
      <polygon points="0,0 60,80 0,160" fill="#123026"/>
      <polygon points="120,0 60,80 120,160" fill="#123026"/>
      <g stroke="#56AB7B" stroke-width="2" opacity="0.30" stroke-dasharray="6 7">
        <path d="M60 -80 L200 80 M60 -80 L-80 80 M60 80 L200 240 M60 80 L-80 240 M60 240 L200 400 M60 240 L-80 400"/>
      </g>
    </pattern>
  </defs>
  <g clip-path="url(#tile)"><rect x="16" y="16" width="480" height="480" fill="url(#argyle)"/></g>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="#2BD3D3" stroke-width="6"/>
  <!-- Beaver face silhouette: round head, small round ears, wide nose, signature buck teeth. -->
  <g>
    <!-- ears -->
    <circle cx="180" cy="178" r="30" fill="#56AB7B"/>
    <circle cx="332" cy="178" r="30" fill="#56AB7B"/>
    <circle cx="180" cy="178" r="14" fill="#123026"/>
    <circle cx="332" cy="178" r="14" fill="#123026"/>
    <!-- head -->
    <ellipse cx="256" cy="254" rx="126" ry="114" fill="#56AB7B"/>
    <!-- eyes -->
    <circle cx="214" cy="234" r="15" fill="#123026"/>
    <circle cx="298" cy="234" r="15" fill="#123026"/>
    <!-- nose -->
    <ellipse cx="256" cy="290" rx="32" ry="21" fill="#123026"/>
    <!-- buck teeth -->
    <rect x="244" y="306" width="9" height="44" rx="3" fill="#E8F3EC"/>
    <rect x="259" y="306" width="9" height="44" rx="3" fill="#E8F3EC"/>
  </g>
</svg>
