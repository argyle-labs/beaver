<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="tile"><rect x="16" y="16" width="480" height="480" rx="108"/></clipPath>
    <pattern id="argyle" width="120" height="160" patternUnits="userSpaceOnUse">
      <rect width="120" height="160" fill="#07140F"/>
      <polygon points="60,0 120,80 60,160 0,80" fill="#1C4D3C"/>
      <polygon points="0,0 60,80 0,160" fill="#123026"/>
      <polygon points="120,0 60,80 120,160" fill="#123026"/>
      <g stroke="#56AB7B" stroke-width="2" opacity="0.30" stroke-dasharray="6 7">
        <path d="M60 -80 L200 80 M60 -80 L-80 80 M60 80 L200 240 M60 80 L-80 240 M60 240 L200 400 M60 240 L-80 400"/>
      </g>
    </pattern>
  </defs>
  <g clip-path="url(#tile)"><rect x="16" y="16" width="480" height="480" fill="url(#argyle)"/></g>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="#56AB7B" stroke-width="6"/>

  <!-- Cute cartoon beaver in the raccoon's line-art style: green fill with dark
       outlines. Big friendly eyes, broad nose, signature buck teeth. -->
  <g stroke-linejoin="round">
    <!-- outer ears (behind head) -->
    <circle cx="180" cy="126" r="37" fill="#56AB7B" stroke="#0B1712" stroke-width="7"/>
    <circle cx="332" cy="126" r="37" fill="#56AB7B" stroke="#0B1712" stroke-width="7"/>
    <!-- inner ears: also behind the head, so the head clips them like the outer ear -->
    <circle cx="180" cy="126" r="29" fill="#0B1712"/>
    <circle cx="332" cy="126" r="29" fill="#0B1712"/>
    <!-- head (covers/cuts off the lower part of the ears + inner ears) -->
    <path d="M256 116 C340 116 400 176 400 254 C400 320 356 370 298 384
             C284 388 228 388 214 384 C156 370 112 320 112 254
             C112 176 172 116 256 116 Z" fill="#56AB7B" stroke="#0B1712" stroke-width="7"/>
  </g>

  <g>

    <!-- cheeks (soft blush) -->
    <circle cx="166" cy="298" r="20" fill="#6FBF92" opacity="0.55"/>
    <circle cx="346" cy="298" r="20" fill="#6FBF92" opacity="0.55"/>

    <!-- eyes: dark with a big glossy catchlight + a small secondary sparkle -->
    <ellipse cx="206" cy="228" rx="25" ry="28" fill="#0B1712"/>
    <ellipse cx="306" cy="228" rx="25" ry="28" fill="#0B1712"/>
    <circle cx="215" cy="218" r="10" fill="#DCF1E6"/>
    <circle cx="315" cy="218" r="10" fill="#DCF1E6"/>
    <circle cx="199" cy="236" r="4.5" fill="#DCF1E6"/>
    <circle cx="299" cy="236" r="4.5" fill="#DCF1E6"/>

    <!-- nose -->
    <path d="M226 266 C238 257 274 257 286 266 C296 276 296 290 286 298
             C274 306 238 306 226 298 C216 290 216 276 226 266 Z" fill="#0B1712"/>

    <!-- philtrum: nose down to the mouth -->
    <path d="M256 304 L256 322" fill="none" stroke="#0B1712" stroke-width="7" stroke-linecap="round"/>

    <!-- slightly-open happy mouth (small dark opening), corners turned up -->
    <path d="M214 324 Q234 316 256 321 Q278 316 298 324 Q294 350 256 355 Q218 350 214 324 Z" fill="#0B1712"/>
    <g fill="none" stroke="#0B1712" stroke-width="7" stroke-linecap="round">
      <path d="M216 324 Q202 315 190 320"/>
      <path d="M296 324 Q310 315 322 320"/>
    </g>

    <!-- buck teeth at the top of the mouth -->
    <rect x="234" y="320" width="21" height="34" rx="6" fill="#DCF1E6" stroke="#0B1712" stroke-width="3"/>
    <rect x="257" y="320" width="21" height="34" rx="6" fill="#DCF1E6" stroke="#0B1712" stroke-width="3"/>
  </g>
</svg>
